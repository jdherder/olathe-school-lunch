<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#d81c25"/>
      <stop offset="55%" stop-color="#b0141b"/>
      <stop offset="100%" stop-color="#5c0a0e"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Thunderbird silhouette, built additively (all pieces black, they merge). -->
  <g fill="#0b0b0b">
    <!-- head: flatter bar + cloud-like crest -->
    <ellipse cx="256" cy="126" rx="92" ry="36"/>
    <circle cx="214" cy="96" r="26"/>
    <circle cx="256" cy="86" r="30"/>
    <circle cx="298" cy="96" r="26"/>
    <!-- beak, pointing right -->
    <path d="M336 116 C 378 100, 410 104, 424 112 C 408 130, 372 140, 338 138 Z"/>

    <!-- body / neck -->
    <rect x="220" y="150" width="72" height="200" rx="32"/>

    <!-- left wing -->
    <g>
      <ellipse cx="148" cy="236" rx="146" ry="46" transform="rotate(-7 148 236)"/>
      <!-- feather scallops along bottom edge -->
      <circle cx="46" cy="262" r="34"/>
      <circle cx="100" cy="284" r="36"/>
      <circle cx="158" cy="294" r="34"/>
      <circle cx="210" cy="298" r="28"/>
    </g>
    <!-- right wing (mirror) -->
    <g transform="translate(512 0) scale(-1 1)">
      <ellipse cx="148" cy="236" rx="146" ry="46" transform="rotate(-7 148 236)"/>
      <circle cx="46" cy="262" r="34"/>
      <circle cx="100" cy="284" r="36"/>
      <circle cx="158" cy="294" r="34"/>
      <circle cx="210" cy="298" r="28"/>
    </g>

    <!-- tail fan: long capsule feathers radiating from ~(256,338) -->
    <g>
      <rect x="242" y="330" width="30" height="168" rx="15"/>
      <rect x="242" y="330" width="30" height="162" rx="15" transform="rotate(16 257 344)"/>
      <rect x="242" y="330" width="30" height="162" rx="15" transform="rotate(-16 257 344)"/>
      <rect x="242" y="330" width="28" height="150" rx="14" transform="rotate(33 257 344)"/>
      <rect x="242" y="330" width="28" height="150" rx="14" transform="rotate(-33 257 344)"/>
      <rect x="242" y="330" width="26" height="132" rx="13" transform="rotate(50 257 344)"/>
      <rect x="242" y="330" width="26" height="132" rx="13" transform="rotate(-50 257 344)"/>
    </g>
  </g>

  <!-- lightning bolt (red, over the chest), centered on x=256 -->
  <path d="M298 168 L234 260 L270 260 L232 360 L318 246 L280 246 L314 168 Z"
        fill="#e6202a"/>
</svg>
